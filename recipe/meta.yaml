{% set name = "splunk-opentelemetry" %}
{% set version = "2.13.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace('-', '_') }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9d0adc2f839f7d6f981104fe48202c1d17640408898e1680de4b8b401b4ce555

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api ==1.45.1
    - opentelemetry-sdk ==1.45.1
    - opentelemetry-propagator-b3 ==1.45.1
    - opentelemetry-exporter-otlp-proto-grpc ==1.45.1
    - opentelemetry-exporter-otlp-proto-http ==1.45.1
    - opentelemetry-configuration ==0.66b1
    - opentelemetry-instrumentation ==0.66b1
    - opentelemetry-instrumentation-logging ==0.66b1
    - opentelemetry-instrumentation-system-metrics ==0.66b1
    - opentelemetry-semantic-conventions ==0.66b1
    - opentelemetry-opamp-client ==0.4b0
    - protobuf >=6.33.5 # not our direct dep, prevents installing vulnerable proto versions (CVE-2025-4565, CVE-2026-0994)
    - requests >=2.33.0 # Upstream dependencies allow vulnerable Requests versions.
    - wrapt >=2.5.1

# tests/integration and tests/test_postgresql_oteltest.py are excluded: they need the
# oteltest harness, which is not packaged for the main channel. tests that exercise the
# repo's docker/ and tools/ helpers are kept by shipping those directories.
test:
  source_files:
    - tests
    - docker
    - tools
  imports:
    - splunk_otel
  commands:
    - pip check
    - pytest -vv tests --ignore=tests/integration --ignore=tests/test_postgresql_oteltest.py
  requires:
    - pip
    - pytest

about:
  home: https://github.com/signalfx/splunk-otel-python
  license: Apache-2.0
  license_file: LICENSE.txt
  license_family: Apache
  summary: The Splunk distribution of OpenTelemetry Python Instrumentation provides a Python agent that automatically instruments your Python application to capture and report distributed traces to SignalFx APM.
  description: |
    This package provides entrypoints to configure OpenTelemetry.
  doc_url: https://github.com/signalfx/splunk-otel-python
  dev_url: https://github.com/signalfx/splunk-otel-python

extra:
  recipe-maintainers:
    - Arishamays1
